name: CI

# Every push to any branch; pull requests reuse the checks of their head commit.
on:
  push:
    branches: ["**"]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Anything besides Markdown changed?
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A branch is compared with main as a whole; main is compared with what it pointed to before the push.
          if [ "$GITHUB_REF_NAME" = main ]; then base="$BEFORE"; else base=$(git merge-base origin/main HEAD); fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"   # new history or unknown base: run everything
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qvE '\.md$'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Compositor and clipboard tools for the Wayland tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sway wl-clipboard
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Tests with coverage
        run: cargo llvm-cov --workspace --cobertura --output-path coverage.xml
      - name: Diff coverage (clipsync-core and clipsync-ffi, 100% of new/changed lines)
        run: |
          pipx run diff-cover coverage.xml --compare-branch=origin/main --fail-under=100 \
            --exclude '*/clipsyncd/*'

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865
      - uses: gradle/actions/setup-gradle@v4
      - name: Compositor and clipboard tools for the interop test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sway wl-clipboard
      - run: ./gradlew lintKotlin :app:lintDebug :session:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: clipsync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run licenses
      - run: npm audit
      - run: npm run build
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test
        working-directory: desktop/src-tauri

  cargo-deny:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: linux/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: desktop/src-tauri/Cargo.toml
