[workspace]
resolver = "3"
members = ["crates/clipsync-core", "crates/clipsync-ffi", "crates/clipsyncd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/josevini/phone-to-pc"
rust-version = "1.88"
# Distributed as binaries and distro packages, not on crates.io.
publish = false

[workspace.dependencies]
clipsync-core = { path = "crates/clipsync-core" }

# The native library of the Android app: small, with panics still unwinding so UniFFI can turn them into exceptions.
[profile.android]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
