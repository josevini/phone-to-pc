[package]
name = "clipsync-ffi"
description = "UniFFI bindings of clipsync-core for the Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib for the Android app and the JVM tests; lib for the Rust tests and uniffi-bindgen.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
clipsync-core.workspace = true
thiserror = "2.0.21"
uniffi = { version = "0.32.2", features = ["cli"] }

[dev-dependencies]
tempfile = "3.27.0"
